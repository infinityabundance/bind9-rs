# bind9-server — the `named` runtime (spec §4.3).
#
# Lifecycle, configuration semantics, views, zones, listeners, authoritative
# and recursive serving, transfers, dynamic update, DNSSEC maintenance,
# control channel, reload/reconfig, signals, logging, statistics, dnstap,
# plugins, rate limiting, privilege and shutdown behavior.
#
# `named` behavior is a lifecycle, not just "receive packet, answer".  That
# lifecycle is modeled and tested here.

