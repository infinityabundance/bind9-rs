# bind9-rs-tools — shared implementations and binaries for the BIND
# command-line utilities (spec §4.4): dig, host, nslookup, delv, mdig,
# nsupdate, rndc, rndc-confgen, named-checkconf, named-checkzone,
# named-compilezone, named-journalprint, arpaname, tsig-keygen,
# ddns-confgen, the dnssec-* family, and every other historically shipped
# utility.
#
# Tools share protocol/semantic implementations with bind9-rs-core rather
# than duplicating them.  Binaries are [[bin]] targets in this crate.
#
# CLI parity (§32) is a first-class court surface: arguments, defaults,
# formatting, exit status, stdin behavior, error wording.

[package]
name = "bind9-rs-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "bind9-rs BIND 9 command-line utilities"

[dependencies]
bind9-rs-core.workspace = true
bind9-rs-platform.workspace = true
idna = "1"
unicode-normalization = "0.1"
# icu_properties: the Unicode bidi-class/joining-type/general-category/script
# data used by the transcribed IDNA2008 label tests (bidi.c, context.c,
# idna.c); the same audited ICU4X data family as the `idna` crate, already in
# the dependency tree.
icu_properties = "2"
# libc: the audited FFI for the OS boundary (capget/capset, prctl, xattr,
# setuid/setgroups, fork/execve, chroot).  Used ONLY inside the platform
# boundary modules (platform::linux + platform::unsafe_boundary) where every
# unsafe site is inventoried (addendum §49).
libc = "0.2"

[[bin]]
name = "dig"
path = "src/bin/dig.rs"

# cap-proc-probe: forensic diagnostic for the CAP-PROC courts (compares the
# process-observable libcap surface against the C oracle in an identical
# container environment); not a BIND-compat tool.
[[bin]]
name = "cap-proc-probe"
path = "src/bin/cap-proc-probe.rs"

# cap-file-probe: forensic diagnostic for the CAP-FILE four-corner courts
# (security.capability xattr interop); not a BIND-compat tool.
[[bin]]
name = "cap-file-probe"
path = "src/bin/cap-file-probe.rs"

# maxminddb-probe: forensic diagnostic for the MMDB courts (mirrors
# forensics/oracle/probes/probe-maxminddb.c byte-for-byte); not a
# BIND-compat tool.
[[bin]]
name = "maxminddb-probe"
path = "src/bin/maxminddb-probe.rs"

# jsonc-probe: forensic diagnostic for the JSON-0001 courts (mirrors
# forensics/oracle/probes/probe-jsonc.c byte-for-byte); not a BIND-compat
# tool.
[[bin]]
name = "jsonc-probe"
path = "src/bin/jsonc-probe.rs"

# lmdb-probe: forensic diagnostic for the LMDB-0001 court (mirrors
# forensics/oracle/probes/probe-lmdb.c byte-for-byte); not a BIND-compat
# tool.
[[bin]]
name = "lmdb-probe"
path = "src/bin/lmdb-probe.rs"

# protobuf-c-probe: forensic diagnostic for the PBC-0001 court (mirrors
# forensics/oracle/probes/probe-protobuf-c.c byte-for-byte); not a
# BIND-compat tool.
[[bin]]
name = "protobuf-c-probe"
path = "src/bin/protobuf-c-probe.rs"

# libedit-probe: forensic diagnostic for the LE-0001 court (mirrors
# forensics/oracle/probes/probe-libedit.c byte-for-byte); not a BIND-compat
# tool.
[[bin]]
name = "libedit-probe"
path = "src/bin/libedit-probe.rs"

# libuv-probe: forensic diagnostic for the LIBUV-0001 court (mirrors
# forensics/oracle/probes/probe-libuv.c byte-for-byte); not a BIND-compat
# tool.
[[bin]]
name = "libuv-probe"
path = "src/bin/libuv-probe.rs"

# liburcu-probe: forensic diagnostic for the LIBURCU-0001 court (mirrors
# forensics/oracle/probes/probe-liburcu.c byte-for-byte); not a BIND-compat
# tool.
[[bin]]
name = "liburcu-probe"
path = "src/bin/liburcu-probe.rs"

[lints]
workspace = true
