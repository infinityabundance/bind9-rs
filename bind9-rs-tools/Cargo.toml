# bind9-rs-tools — shared implementations and binaries for the BIND
# command-line utilities (spec §4.4): dig, host, nslookup, delv, mdig,
# nsupdate, rndc, rndc-confgen, named-checkconf, named-checkzone,
# named-compilezone, named-journalprint, arpaname, tsig-keygen,
# ddns-confgen, the dnssec-* family, and every other historically shipped
# utility.
#
# Tools share protocol/semantic implementations with bind9-rs-core rather
# than duplicating them.  Binaries are [[bin]] targets in this crate.
#
# CLI parity (§32) is a first-class court surface: arguments, defaults,
# formatting, exit status, stdin behavior, error wording.

[package]
name = "bind9-rs-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
authors.workspace = true
description = "bind9-rs BIND 9 command-line utilities"

[dependencies]
bind9-rs-core.workspace = true
bind9-rs-platform.workspace = true
idna = "1"
unicode-normalization = "0.1"
# libc: the audited FFI for the OS boundary (capget/capset, prctl, xattr,
# setuid/setgroups, fork/execve, chroot).  Used ONLY inside the platform
# boundary modules (platform::linux + platform::unsafe_boundary) where every
# unsafe site is inventoried (addendum §49).
libc = "0.2"

[[bin]]
name = "dig"
path = "src/bin/dig.rs"

# cap-proc-probe: forensic diagnostic for the CAP-PROC courts (compares the
# process-observable libcap surface against the C oracle in an identical
# container environment); not a BIND-compat tool.
[[bin]]
name = "cap-proc-probe"
path = "src/bin/cap-proc-probe.rs"

# cap-file-probe: forensic diagnostic for the CAP-FILE four-corner courts
# (security.capability xattr interop); not a BIND-compat tool.
[[bin]]
name = "cap-file-probe"
path = "src/bin/cap-file-probe.rs"

[lints]
workspace = true
