schema_version = 1
court_id = "LZ-0001"
question = "Does the Rust libidn2 module (compat/libidn2.rs) reproduce libidn2 2.3.8 observable behavior byte-exactly: the `_lz` locale layer (idn2_to_ascii_lz = idn2_lookup_ul: locale-codeset → UTF-8 conversion with the ICONV_FAIL taxonomy, then idn2_lookup_u8 with IDN2_NFC_INPUT forced; and idn2_to_unicode_8zlz: UTF-8 decode + UTF-8 → locale-codeset conversion with the ENCODING_ERROR taxonomy) across the three pinned locales (C.UTF-8, C/ANSI_X3.4-1968, en_US.ISO-8859-1); the IDN2_NO_TR46 pure-IDNA2008 path (the reachable NO_TR46 flags — any TRANSITIONAL/NONTRANSITIONAL combination is INVALID_FLAGS); the full flag-conflict taxonomy; and the label-test corners (leading combining mark, 2-hyphen, hyphen-start/end asymmetry between the TR46 and NO_TR46 test sets, unassigned, RFC 5893 bidi, the ZWNJ/ZWJ joining rules, the ContextO rules, STD3-disallowed handling, and the 63/255 length limits)?"
subsystem = "compat/libidn2"
oracle_versions = ["2.3.8"]
harness = "libidn2-lz"
normalization = [
    "none: stdout, stderr and exit status are compared byte-exactly; both probes run in the same oracle-libidn2-2.3.8 container, and each `locale` run is pinned by LANG to a locale generated in the image (C.UTF-8, C, en_US.ISO-8859-1), so the resolved codeset is deterministic",
]
invariants = [
    "the `== locale <codeset> ==` header matches for every pinned locale (UTF-8, ANSI_X3.4-1968, ISO-8859-1)",
    "the lz conversions match for the UTF-8 and ISO-8859-1 byte inputs under every locale, incl. IDN2_ICONV_FAIL for bytes undecodable in the active codeset (the latin1 bytes under C.UTF-8/C, the UTF-8 bytes under C, the high bytes under C)",
    "the 8zlz decodes match, incl. IDN2_ENCODING_ERROR when the U-label has no representation in the active codeset (münchen.de under C), and the case-preserving decode of mixed-case A-labels",
    "the NO_TR46 pure-IDNA2008 path matches: uppercase and deviations preserved (MÜNCHEN.de, faß.de, ς.gr, ßß.com), soft hyphen/ZWNJ/ZWJ/emoji disallowed, the A-label round-trip of existing xn-- labels",
    "the flag taxonomy matches: TRANSITIONAL|NONTRANSITIONAL, NONTRANSITIONAL|NO_TR46, TRANSITIONAL|NO_TR46 and ALABEL_ROUNDTRIP|NO_ALABEL_ROUNDTRIP are IDN2_INVALID_FLAGS; 0 flags default to NONTRANSITIONAL; NO_ALABEL_ROUNDTRIP disables the A-label re-test",
    "the label tests match on both paths: leading combining mark → IDN2_LEADING_COMBINING; 2-hyphen on non-ASCII labels → IDN2_2HYPHEN; hyphen-start/end fails the TR46 set but passes NO_TR46; unassigned (U+0378) → IDN2_UNASSIGNED; RFC 5893 bidi ok/bad; ZWNJ between joining Arabic letters passes and ZWJ without a virama fails (IDN2_CONTEXTJ); the middle-dot/keraia/katakana ContextO rules; STD3 rules dropping '_'",
    "the length limits match: a 64-byte ASCII label is IDN2_TOO_BIG_LABEL and a long non-ASCII label overflows the punycode buffer (IDN2_PUNYCODE_BIG_OUTPUT)",
    "stderr is empty and the exit status is 0 for every run on both sides",
]
timeout_secs = 300
nondeterminism_policy = "all inputs are fixed byte strings; the locale is pinned per run via LANG (each probe resolves the codeset from the environment: nl_langinfo(CODESET) after setlocale(LC_ALL, \"\") vs the LC_ALL/LC_CTYPE/LANG resolver); nothing pointer, address or wall-clock dependent is printed"
security_classification = "the IDNA2008/UTS #46 surface is the parser-facing attack surface of IDN handling: the TR46 mapping-table decode (compressed rows + LEB128 payload), RFC 3492 punycode (overflow-checked), the RFC 5892 context rules and the RFC 5893 bidi check; both implementations must reject rather than crash"
references = [
    "libidn2-2.3.8 lib/lookup.c, lib/idna.c, lib/decode.c, lib/tr46map.{h,c}, lib/bidi.c, lib/context.c, lib/data.c, lib/punycode.c, lib/error.c, lib/idn2.h.in (pinned archive sha256 f557911bf6171621e1f72ff35f5b1825bb35b52ed45325dcdee931e5d3c0787a)",
    "forensics/oracle/probes/probe-libidn2-lz.c",
    "bind9-rs-tools/src/bin/libidn2-lz-probe.rs",
    "bind9-rs-tools/src/compat/libidn2.rs",
    "bind9-rs-tools/src/compat/libidn2_data.rs (generated by scripts/archaeology/gen-libidn2-table.py)",
    "bind9-rs-tools/src/compat/libidn2_tr46map.rs (generated by scripts/archaeology/gen-libidn2-tr46map.py from lib/tr46map_data.c)",
    "addendum §28 (libidn2), §37 (C probe courts)",
]
