    "forensics/oracle/probes/gen_descriptors.py",
    "bind9-rs-tools/src/bin/protobuf-c-probe.rs",
    "bind9-rs-tools/src/bin/protobuf_c_gen.rs",
    "bind9-rs-tools/src/compat/protobuf_c.rs",
    "addendum §26 (protobuf-c), §38 (C probe courts)",
]
