# bind9-tools — shared implementations and binaries for the BIND command-line
# utilities (spec §4.4): dig, host, nslookup, delv, mdig, nsupdate, rndc,
# rndc-confgen, named-checkconf, named-checkzone, named-compilezone,
# named-journalprint, arpaname, tsig-keygen, ddns-confgen, the dnssec-*
# family, and every other historically shipped utility.
#
# Tools share protocol/semantic implementations with bind9-core rather than
# duplicating them.  Binaries are [[bin]] targets in this crate.
#
# CLI parity (§32) is a first-class court surface: arguments, defaults,
# formatting, exit status, stdin behavior, error wording.

[package]
name = "bind9-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "bind9-rs BIND 9 command-line utilities"

[dependencies]
bind9-core.workspace = true
bind9-platform.workspace = true

[[bin]]
name = "dig"
path = "src/bin/dig.rs"

[lints]
workspace = true
