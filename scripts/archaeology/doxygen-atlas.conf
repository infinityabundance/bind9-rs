# Doxygen configuration for the bind9-rs custodian API atlas.
#
# Purpose (archaeological mandate): produce an exhaustive, machine-readable
# inventory of every code surface in a pinned BIND 9 release, so that
# "complete custodian-level parity" is a tracked property rather than a hope.
# The XML output is parsed by scripts/archaeology/parse-doxygen-xml.py into
# per-library JSON inventories under forensics/archaeology/api-atlas/, and
# the coverage ledger maps each surface to archaeology records, courts and
# Rust modules.
#
# Run via scripts/archaeology/doxygen-atlas.sh.

PROJECT_NAME           = "BIND 9 API Atlas (bind9-rs custodian archive)"
PROJECT_NUMBER         = "9.20.26"
OUTPUT_DIRECTORY       = forensics/oracle/work/doxygen-out
INPUT                  = lib/isc lib/dns lib/isccfg lib/ns bin fuzz
RECURSIVE              = YES
FILE_PATTERNS          = *.c *.h *.in
EXCLUDE                =
EXCLUDE_PATTERNS       = */test/* */tests/* */.libs/* */system/*

# Extract EVERYTHING: static functions and internal helpers are part of the
# behavioral surface (courts frequently depend on them).
EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES
EXTRACT_PRIVATE        = YES
EXTRACT_LOCAL_CLASSES  = YES
EXTRACT_ANON_NSPACES   = YES
EXTRACT_PACKAGE        = YES
HIDE_UNDOC_MEMBERS     = NO
HIDE_UNDOC_CLASSES     = NO

# BIND's /*% brief */ convention via the upstream input filter.
INPUT_FILTER           = "perl doc/doxygen/doxygen-input-filter"

# Resolve the build configuration so conditional code appears as built.
ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
EXPAND_ONLY_PREDEF     = NO
INCLUDE_PATH           = .
INCLUDE_FILE_PATTERNS  = *.h
PREDEFINED             = "DOXYGEN=1"
SEARCH_INCLUDES        = YES

# Both the human-readable reference and the machine-readable XML.
GENERATE_HTML          = YES
GENERATE_XML           = YES
XML_PROGRAMLISTING     = YES
XML_OUTPUT             = xml

QUIET                  = YES
WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = NO
WARN_IF_DOC_ERROR      = NO

GENERATE_LATEX         = NO
GENERATE_MAN           = NO
GENERATE_RTF           = NO
HAVE_DOT               = NO
