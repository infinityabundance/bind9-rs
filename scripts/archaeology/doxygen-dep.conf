# Doxygen configuration for a conserved BIND dependency (bind9-rs-tools
# custodian archive, addendum §7).  Adapted from the BIND atlas configuration;
# dependencies have no upstream doxygen input filter, and INCLUDE_PATH is set
# per dependency by scripts/archaeology/doxygen-deps.sh.
#
# @TREE@ and @XMLOUT@ are substituted by the wrapper script.

PROJECT_NAME           = "BIND dependency API atlas (bind9-rs custodian archive)"
OUTPUT_DIRECTORY       = @XMLOUT@
INPUT                  = @TREE@
RECURSIVE              = YES
FILE_PATTERNS          = *.c *.h
EXCLUDE_PATTERNS       = */.libs/* */build/*

EXTRACT_ALL            = YES
EXTRACT_STATIC         = YES
EXTRACT_PRIVATE        = YES
EXTRACT_LOCAL_CLASSES  = YES
EXTRACT_ANON_NSPACES   = YES
EXTRACT_PACKAGE        = YES
HIDE_UNDOC_MEMBERS     = NO
HIDE_UNDOC_CLASSES     = NO

ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES
EXPAND_ONLY_PREDEF     = NO
INCLUDE_PATH           = @TREE@
INCLUDE_FILE_PATTERNS  = *.h
PREDEFINED             = "DOXYGEN=1"
SEARCH_INCLUDES        = YES

GENERATE_HTML          = NO
GENERATE_XML           = YES
XML_PROGRAMLISTING     = YES
XML_OUTPUT             = xml

QUIET                  = YES
WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = NO
WARN_IF_DOC_ERROR      = NO

GENERATE_LATEX         = NO
GENERATE_MAN           = NO
GENERATE_RTF           = NO
HAVE_DOT               = NO
